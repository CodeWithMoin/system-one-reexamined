[project]
name = "s1x"
version = "0.1.0"
description = "System One models, re-examined: typed-decision models vs the classifiers we already had"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.13",
]

[project.optional-dependencies]
laya = ["laya-mlx"]
nli = ["transformers>=4.48", "torch>=2.4"]
fewshot = ["setfit>=1.1", "sentence-transformers>=3.3", "transformers>=4.48", "torch>=2.4"]
dev = ["pytest>=8"]

[project.scripts]
s1x = "s1x.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s1x"]
